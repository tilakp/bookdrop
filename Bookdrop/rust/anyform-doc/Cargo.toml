[package]
name = "anyform-doc"
edition.workspace = true
version.workspace = true

[dependencies]
anyform-core = { path = "../anyform-core" }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
roxmltree = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
headless_chrome = "1.0.22"
lopdf = "0.44.0"
base64 = "0.23.1"
regex = "1.13.1"
sha1 = "0.10.7"
docx-rs = { version = "0.4", default-features = false }
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_latest", "thread_safe"] }

[dev-dependencies]
